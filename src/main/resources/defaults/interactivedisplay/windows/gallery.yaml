id: gallery
size:
  width: 4.8
  height: 3.2
offset:
  forward: 2.6
  horizontal: 0.0
  vertical: 0.6
components:
  - id: background
    type: panel
    position:
      x: 0.0
      y: -1.2
      z: 0.0
    size:
      width: 4.8
      height: 3.2
    backgroundColor: "#CC10243A"
    children: []
  - id: title
    type: text
    position:
      x: 0.0
      y: 1.12
      z: 0.03
    size:
      width: 4.2
      height: 0.35
    content: "DISPLAY SHOWCASE"
    fontSize: 0.52
    color: "#79D9FF"
    alignment: center
    background: "#00000000"
  - id: subtitle
    type: text
    position:
      x: 0.0
      y: 0.82
      z: 0.03
    size:
      width: 4.2
      height: 0.25
    content: "ITEM  ·  BLOCK  ·  TEXT"
    fontSize: 0.3
    color: "#B9C7D6"
    alignment: center
    background: "#00000000"
  - id: item
    type: image
    position:
      x: -1.45
      y: 0.22
      z: 0.05
    size:
      width: 1.0
      height: 1.0
    imageType: item
    value: "minecraft:diamond"
    scale: 1.0
  - id: block
    type: image
    position:
      x: 1.45
      y: 0.22
      z: 0.05
    size:
      width: 1.0
      height: 1.0
    imageType: block
    value: "minecraft:emerald_block"
    scale: 1.0
  - id: text_sample
    type: text
    position:
      x: 0.0
      y: 0.25
      z: 0.05
    size:
      width: 1.3
      height: 0.7
    content: "TextDisplay\n한글 ✨"
    fontSize: 0.4
    lineWidth: 80
    color: "#FFE7A6"
    alignment: center
    background: "#663D244C"
  - id: item_label
    type: text
    position:
      x: -1.45
      y: -0.62
      z: 0.05
    size:
      width: 1.2
      height: 0.25
    content: "ITEM"
    fontSize: 0.28
    color: "#B9E7FF"
    alignment: center
    background: "#00000000"
  - id: block_label
    type: text
    position:
      x: 1.45
      y: -0.62
      z: 0.05
    size:
      width: 1.2
      height: 0.25
    content: "BLOCK"
    fontSize: 0.28
    color: "#B9E7FF"
    alignment: center
    background: "#00000000"
  - id: back
    type: button
    position:
      x: -0.85
      y: -1.23
      z: 0.05
    size:
      width: 1.4
      height: 0.4
    label: "홈"
    fontSize: 0.36
    clickType: both
    hoverScale: 1.05
    backgroundColor: "#CC174A7E"
    hoverColor: "#EE2B78B5"
    clickSound: "minecraft:ui.button.click"
    action:
      type: open_window
      target: sample_index
  - id: close
    type: button
    position:
      x: 0.85
      y: -1.23
      z: 0.05
    size:
      width: 1.4
      height: 0.4
    label: "닫기"
    fontSize: 0.36
    clickType: both
    hoverScale: 1.05
    backgroundColor: "#CC992222"
    hoverColor: "#EECC4444"
    clickSound: "minecraft:ui.button.click"
    action:
      type: close_window
