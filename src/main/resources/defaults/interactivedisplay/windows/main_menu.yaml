id: main_menu
size:
  width: 3.0
  height: 2.0
offset:
  forward: 2.0
  horizontal: 0.0
  vertical: 0.5
components:
  - id: background
    type: panel
    position:
      x: 0.0
      y: 0.0
      z: 0.0
    size:
      width: 3.0
      height: 2.0
    backgroundColor: "#88000000"
    children: []
  - id: title
    type: text
    position:
      x: 0.0
      y: 0.45
      z: 0.01
    width: 2.6
    height: 0.35
    content: InteractiveDisplay
    fontSize: 0.7
    alignment: center
    background: "#00000000"
  - id: content
    type: text
    position:
      x: 0.0
      y: 0.05
      z: 0.01
    width: 2.6
    height: 0.45
    content: "샘플 창 내용"
    fontSize: 0.5
    alignment: center
    color: "#E8E8E8"
    background: "#00000000"
  - id: close
    type: button
    position:
      x: 0.0
      y: -0.55
      z: 0.01
    size:
      width: 0.45
      height: 0.35
    label: "☒"
    fontSize: 1.0
    backgroundColor: "#CC992222"
    hoverColor: "#EECC4444"
    clickSound: "minecraft:ui.button.click"
    action:
      type: close_window
