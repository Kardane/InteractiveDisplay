id: main_menu2
size:
  width: 3.2
  height: 2.2
offset:
  forward: 3.0
  horizontal: 0.0
  vertical: 0.5
components:
  - id: background
    type: panel
    position:
      x: 0.0
      y: -1.0
      z: 0.0
    size:
      width: 3.2
      height: 2.2
    backgroundColor: "#CC10243A"
    children: []
  - id: title
    type: text
    position:
      x: 0.0
      y: 0.45
      z: 0.01
    width: 2.6
    height: 0.35
    content: "BUTTON ACTIONS"
    fontSize: 0.6
    alignment: center
    background: "#00000000"
  - id: content
    type: text
    position:
      x: 0.0
      y: 0.18
      z: 0.01
    width: 2.6
    height: 0.45
    content: "기존 main_menu2 ID를 유지한 버튼 샘플"
    fontSize: 0.4
    alignment: center
    color: "#E8E8E8"
    background: "#00000000"
  - id: back_main
    type: button
    position:
      x: -0.65
      y: -0.55
      z: 0.01
    size:
      width: 1.25
      height: 0.35
    label: "샘플 목록"
    fontSize: 0.4
    backgroundColor: "#CC225577"
    hoverColor: "#EE3388AA"
    action:
      type: open_window
      target: sample_index
  - id: command_ping
    type: button
    position:
      x: 0.65
      y: -0.55
      z: 0.01
    size:
      width: 1.35
      height: 0.35
    label: "버튼 기능"
    fontSize: 0.4
    backgroundColor: "#CC9A8124"
    hoverColor: "#EEC5A534"
    action:
      type: open_window
      target: button_showcase
  - id: close2
    type: button
    position:
      x: 0.0
      y: -0.98
      z: 0.01
    size:
      width: 1.4
      height: 0.35
    label: "✕"
    fontSize: 0.75
    backgroundColor: "#CC992222"
    hoverColor: "#EECC4444"
    action:
      type: close_window
