id: map_showcase
size:
  width: 4.2
  height: 3.0
offset:
  forward: 3.0
  horizontal: 0.0
  vertical: 0.6
components:
  - id: background
    type: panel
    position:
      x: 0.0
      y: -1.1
      z: 0.0
    size:
      width: 4.2
      height: 3.0
    backgroundColor: "#CC10243A"
    children: []
  - id: title
    type: text
    position:
      x: 0.0
      y: 1.05
      z: 0.03
    size:
      width: 3.8
      height: 0.35
    content: "FIXED MAP SHOWCASE"
    fontSize: 0.48
    color: "#79D9FF"
    alignment: center
    background: "#00000000"
  - id: map
    type: image
    position:
      x: 0.0
      y: 0.05
      z: 0.05
    size:
      width: 2.0
      height: 2.0
    imageType: map
    value: "sample_local.png"
    scale: 1.0
  - id: hint
    type: text
    position:
      x: 0.0
      y: -1.0
      z: 0.05
    size:
      width: 3.6
      height: 0.3
    content: "MAP은 FIXED 모드에서만 표시됩니다"
    fontSize: 0.28
    color: "#B9C7D6"
    alignment: center
    background: "#00000000"
  - id: close
    type: button
    position:
      x: 0.0
      y: -1.35
      z: 0.05
    size:
      width: 1.4
      height: 0.4
    label: "닫기"
    fontSize: 0.36
    clickType: both
    hoverScale: 1.05
    backgroundColor: "#CC992222"
    hoverColor: "#EECC4444"
    clickSound: "minecraft:ui.button.click"
    action:
      type: close_window
