id: sample_index
size:
  width: 4.2
  height: 2.6
offset:
  forward: 2.6
  horizontal: 0.0
  vertical: 0.6
components:
  - id: background
    type: panel
    position:
      x: 0.0
      y: -1.0
      z: 0.0
    size:
      width: 4.2
      height: 2.6
    backgroundColor: "#CC10243A"
    children: []
  - id: title
    type: text
    position:
      x: 0.0
      y: 0.62
      z: 0.02
    size:
      width: 3.8
      height: 0.35
    content: "INTERACTIVE DISPLAY SAMPLES"
    fontSize: 0.48
    color: "#79D9FF"
    alignment: center
    background: "#00000000"
  - id: display
    type: button
    position:
      x: 0.0
      y: 0.0
      z: 0.03
    size:
      width: 2.8
      height: 0.48
    label: "Display Showcase"
    fontSize: 0.34
    clickType: both
    hoverScale: 1.05
    action:
      type: open_window
      target: display_showcase
  - id: menu
    type: button
    position:
      x: 0.0
      y: -0.62
      z: 0.03
    size:
      width: 2.8
      height: 0.48
    label: "기본 창"
    fontSize: 0.34
    clickType: both
    hoverScale: 1.05
    action:
      type: open_window
      target: main_menu
  - id: close
    type: button
    position:
      x: 0.0
      y: -1.08
      z: 0.03
    size:
      width: 0.42
      height: 0.42
    label: "×"
    fontSize: 0.5
    padding:
      horizontal: 0.04
      vertical: 0.04
    alignment:
      horizontal: center
      vertical: center
    clickType: both
    action:
      type: close_window
