id: text_animation_fade_linear
size:
  width: 4.2
  height: 2.6
offset:
  forward: 2.6
  horizontal: 0.0
  vertical: 0.6
components:
  - id: background
    type: panel
    position:
      x: 0.0
      y: -0.95
      z: 0.0
    size:
      width: 4.2
      height: 2.6
    backgroundColor: "#CC10243A"
    children: []
  - id: title
    type: text
    position:
      x: 0.0
      y: 0.82
      z: 0.03
    size:
      width: 3.6
      height: 0.3
    content: "FADE · LINEAR"
    fontSize: 0.48
    color: "#79D9FF"
    alignment: center
    background: "#00000000"
  - id: animated_text
    type: text
    position:
      x: 0.0
      y: 0.12
      z: 0.03
    size:
      width: 3.6
      height: 0.55
    content: "선형으로 나타나는 텍스트"
    fontSize: 0.42
    color: "#A8E6CF"
    alignment: center
    background: "#661B4D3E"
    animations:
      - type: fade
        delay: 2
        duration: 20
        interpolation: linear
  - id: back
    type: button
    position:
      x: -0.85
      y: -0.85
      z: 0.04
    size:
      width: 1.35
      height: 0.4
    label: "목록"
    fontSize: 0.34
    clickType: both
    hoverScale: 1.05
    backgroundColor: "#CC174A7E"
    hoverColor: "#EE2B78B5"
    clickSound: "minecraft:ui.button.click"
    action:
      type: open_window
      target: text_animation_showcase
  - id: close
    type: button
    position:
      x: 0.85
      y: -0.85
      z: 0.04
    size:
      width: 1.35
      height: 0.4
    label: "닫기"
    fontSize: 0.34
    clickType: both
    hoverScale: 1.05
    backgroundColor: "#CC992222"
    hoverColor: "#EECC4444"
    clickSound: "minecraft:ui.button.click"
    action:
      type: close_window
